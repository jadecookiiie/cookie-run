<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://i.pinimg.com/originals/8f/3a/a5/8f3aa514229088c55ec80ffe9e853031.png">
    <title>Cookie Run Database</title>
    <link href="https://fonts.googleapis.com/css2?family=Didact+Gothic&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f1e3;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --accent-color: #ffb142;
            --border-radius: 12px;
        }

        body {
            font-family: 'Didact Gothic', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            letter-spacing: 0.5px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            margin-bottom: 5px;
            color: #ae00ff;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .search-box {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ccae62;
            border-radius: var(--border-radius);
            margin-bottom: 30px;
            box-sizing: border-box;
        }

        .cookie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .cookie-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .cookie-hero {
            position: relative;
            background: #f1f2f6;
            text-align: center;
            padding: 20px;
        }

        .cookie-img {
            max-width: 130px;
            height: auto;
            object-fit: contain;
        }

        .rarity-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .rarity-common { background-color: #a88a5d; }
        .rarity-rare { background-color: #5b5bb5; }
        .rarity-epic { background-color: #fc0865; }
        .rarity-super-epic { background-color: #c26c4f; }
        .rarity-ancient { background-color: #a702e8; }
        .rarity-legendary { background-color: #02e8af; color: #2c3e50; }
        .rarity-beast { background-color: #6e0303; }
        .rarity-special { background-color: #f1c40f; color: #2c3e50; }
        .rarity-fanmade { background-color: #a1eb0e; }
        .rarity-witch { background-color: #d905fa; }
        }

        .cookie-info {
            padding: 20px;
            flex-grow: 1;
        }

        .cookie-meta {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 15px;
        }

        .skill-section {
            background: #f8f9fa;
            border-left: 4px solid var(--accent-color);
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .skill-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .skill-desc {
            font-size: 13px;
            color: #57606f;
        }

        .costume-heading {
            font-size: 14px;
            font-weight: bold;
            margin-top: 15px;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }

        .costume-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 8px;
        }

        .costume-item {
            text-align: center;
            background: #fafafa;
            border: 1px solid #f0f0f0;
            border-radius: 6px;
            padding: 5px;
        }

        .costume-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            display: block;
            margin: 0 auto 4px auto;
            background: #eee;
            border-radius: 4px;
        }

        .costume-name {
            font-size: 11px;
            color: #333;
        }
        .custom-dropdown {
          position: relative;
          display: inline-block;
        }

        .menu-btn {
          background-color: #ff94b9;
          color: white;
          padding: 10px 18px;
          font-size: 16px;
          font-weight: bold;
          border-radius: 8px;
          border: none;
          outline: none;
          box-shadow: none;
          cursor: pointer;
        }

        .menu-btn:hover {
          background-color: #e87fa4;
        }

        .menu-items {
          display: none;
          position: absolute;
          top: 100%;
          left: 0;
          margin-top: 6px;
          background-color: #ffffff;
          min-width: 180px;
          border-radius: 8px;
          box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
          z-index: 999;
          overflow: hidden;
        }

        .menu-items a {
          color: #333333;
          padding: 12px 16px;
          text-decoration: none;
          display: block;
          font-family: sans-serif;
          font-size: 14px;
        }

        .menu-items a:hover {
          background-color: #f5f5f5;
        }

        .custom-dropdown:hover .menu-items {
          display: block;
        }
    </style>
</head>

    function displayCookies(cookies) {
    const counterSpan = document.getElementById('counterNumber');
        if (counterSpan) {
            counterSpan.innerText = cookies.length;
        }
        const grid = document.getElementById('cookieGrid');
        grid.innerHTML = ""; // Clear existing

        if(cookies.length === 0) {
            grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>No Cookies fit that description. What else can you think of about them?</p>";
            return;
        }

        cookies.forEach(cookie => {
            let costumesHTML = '';
            if(cookie.costumes && cookie.costumes.length > 0) {
                cookie.costumes.forEach(costume => {
                    costumesHTML += `
                        <div class="costume-item">
                            <img class="costume-img" src="${costume.image}" alt="${costume.name}">
                            <div class="costume-name">${costume.name}</div>
                        </div>
                    `;
                });
            } else {
                costumesHTML = '<p style="font-size:12px; color:#aaa; margin:0;">No costumes added yet! Maybe later?</p>';
            }

            const card = document.createElement('div');
            const rarityClass = `rarity-${cookie.rarity.toLowerCase().replace(' ', '-')}`;
            card.className = 'cookie-card';
            card.innerHTML = `
                <div class="cookie-hero">
                    <span class="rarity-badge ${rarityClass}">${cookie.rarity}</span>
                    <img class="cookie-img" src="${cookie.image}" alt="${cookie.name}">
                </div>
                <div class="cookie-info">
                    <h2 style="margin: 0 0 5px 0; font-size: 20px;">${cookie.name}</h2>
                    <div class="cookie-meta"><strong>${cookie.type}</strong> • ${cookie.position} Line</div>
                    
                    <div class="skill-section">
                        <div class="skill-name">${cookie.skill.name}</div>
                        <div class="skill-desc">${cookie.skill.description}</div>
                    </div>

                    <div class="costume-heading">Costumes</div>
                    <div class="costume-list">${costumesHTML}</div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
        const query = e.target.value.toLowerCase();
        const filtered = cookieDatabase.filter(cookie => 
            cookie.name.toLowerCase().includes(query) ||
            cookie.type.toLowerCase().includes(query) ||
            cookie.rarity.toLowerCase().includes(query)
        );
        displayCookies(filtered);
    });

    displayCookies(cookieDatabase);
</script>
