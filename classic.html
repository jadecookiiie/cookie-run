<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cookie Run: Classic Database</title>

    <style>
        :root {
            --bg-color: #f7f1e3;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --accent-color: #ffb142;
            --border-radius: 12px;
        }

        body {
            font-family: 'Didact Gothic', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            letter-spacing: 0.5px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            margin-bottom: 5px;
            color: #ae00ff;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .search-box {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ccae62;
            border-radius: var(--border-radius);
            margin-bottom: 30px;
            box-sizing: border-box;
        }

        .cookie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .cookie-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .cookie-hero {
            position: relative;
            background: #f1f2f6;
            text-align: center;
            padding: 20px;
        }

        .cookie-img {
            max-width: 130px;
            height: auto;
            object-fit: contain;
        }

        .rarity-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .rarity-c { background-color: #d9d9d9; color: #8a8a8a; }
        .rarity-b { background-color: #b2b2eb; color: #5b5bb5; }
        .rarity-a { background-color: #f1c40f; color: #ff0000; }
        .rarity-s { background-color: #d905fa; }
        .rarity-s-plus { background-color: #a702e8; }
        .rarity-l { background-color: #ff0000; }
        .rarity-e { background-color: #32a852; color: #f1c40f; }

        .cookie-info {
            padding: 20px;
            flex-grow: 1;
        }

        .ability-section {
            background: #f8f9fa;
            border-left: 4px solid var(--accent-color);
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .ability-title {
            font-weight: bold;
            font-size: 12px;
            color: #7f8c8d;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .ability-desc {
            font-size: 13px;
            color: #57606f;
            line-height: 1.4;
        }

        .combi-section {
            background: #fff8e7;
            border: 1px solid #ffeaa7;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .combi-img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            background: #fff;
            border-radius: 50%;
            border: 1px solid #fdcb6e;
            padding: 2px;
        }

        .combi-details {
            font-size: 13px;
        }

        .combi-label {
            font-size: 11px;
            font-weight: bold;
            color: #d63031;
            text-transform: uppercase;
        }

        .combi-name {
            font-weight: bold;
            color: #2d3436;
        }

        .costume-heading {
            font-size: 14px;
            font-weight: bold;
            margin-top: 15px;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }

        .costume-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 8px;
        }

        .costume-item {
            text-align: center;
            background: #fafafa;
            border: 1px solid #f0f0f0;
            border-radius: 6px;
            padding: 5px;
        }

        .costume-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            display: block;
            margin: 0 auto 4px auto;
            background: #eee;
            border-radius: 4px;
        }

        .costume-name {
            font-size: 11px;
            color: #333;
        }

        .custom-dropdown {
          position: relative;
          display: inline-block;
        }

        .menu-btn {
          background-color: #ff94b9;
          color: white;
          padding: 10px 18px;
          font-size: 16px;
          font-weight: bold;
          border-radius: 8px;
          border: none;
          outline: none;
          box-shadow: none;
          cursor: pointer;
        }

        .menu-btn:hover {
          background-color: #e87fa4;
        }

        .menu-items {
          display: none;
          position: absolute;
          top: 100%;
          left: 0;
          margin-top: 6px;
          background-color: #ffffff;
          min-width: 180px;
          border-radius: 8px;
          box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
          z-index: 999;
          overflow: hidden;
        }

        .menu-items a {
          color: #333333;
          padding: 12px 16px;
          text-decoration: none;
          display: block;
          font-family: sans-serif;
          font-size: 14px;
        }

        .menu-items a:hover {
          background-color: #f5f5f5;
        }

        .custom-dropdown:hover .menu-items {
          display: block;
        }
    </style>
</head>

    function displayCookies(cookies) {
        const counterSpan = document.getElementById('counterNumber');
        if (counterSpan) {
            counterSpan.innerText = cookies.length;
        }
        const grid = document.getElementById('cookieGrid');
        grid.innerHTML = ""; 

        if(cookies.length === 0) {
            grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>No Cookies fit that description. What else can you think of about them?</p>";
            return;
        }

        cookies.forEach(cookie => {
            let costumesHTML = '';
            if(cookie.costumes && cookie.costumes.length > 0) {
                cookie.costumes.forEach(costume => {
                    costumesHTML += `
                        <div class="costume-item">
                            <img class="costume-img" src="${costume.image}" alt="${costume.name}">
                            <div class="costume-name">${costume.name}</div>
                        </div>
                    `;
                });
            } else {
                costumesHTML = '<p style="font-size:12px; color:#aaa; margin:0;">No costumes added yet! Maybe later?</p>';
            }

            const card = document.createElement('div');
            const rarityClass = `rarity-${cookie.rarity.toLowerCase().replace(/\+/g, '-plus').replace(/\s+/g, '-')}`;
            
            card.className = 'cookie-card';
            card.innerHTML = `
                <div class="cookie-hero">
                    <span class="rarity-badge ${rarityClass}">${cookie.rarity}</span>
                    <img class="cookie-img" src="${cookie.image}" alt="${cookie.name}">
                </div>
                <div class="cookie-info">
                    <h2 style="margin: 0 0 10px 0; font-size: 20px;">${cookie.name}</h2>
                    
                    <div class="ability-section">
                        <div class="ability-title">Ability</div>
                        <div class="ability-desc">${cookie.ability}</div>
                    </div>

                    <div class="combi-section">
                        <img class="combi-img" src="${cookie.combiBonus.image}" alt="Pet Combi">
                        <div class="combi-details">
                            <div class="combi-label">Combi Bonus</div>
                            <div class="combi-name">${cookie.combiBonus.name}</div>
                        </div>
                    </div>

                    <div class="costume-heading">Costumes</div>
                    <div class="costume-list">${costumesHTML}</div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
        const query = e.target.value.toLowerCase();
        const filtered = cookieDatabase.filter(cookie => 
            cookie.name.toLowerCase().includes(query) ||
            cookie.rarity.toLowerCase().includes(query) ||
            cookie.combiBonus.name.toLowerCase().includes(query)
        );
        displayCookies(filtered);
    });

    displayCookies(cookieDatabase);
</script>
